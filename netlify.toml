[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Intestazioni di sicurezza per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    # Script e stili solo dal sito stesso; le chiamate API verso HTTPS (restringere al dominio del backend quando è definitivo)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Il sito non può essere incorporato in altre pagine (clickjacking della cassa)
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# I file in /assets hanno l'hash nel nome: si possono tenere in cache per sempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
